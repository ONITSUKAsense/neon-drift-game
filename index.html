<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#06020d">
<title>NEON DRIFT · 霓虹夜驰</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<canvas id="scene" aria-label="NEON DRIFT 游戏画面"></canvas>

<div id="fx" aria-hidden="true"></div>
<div id="flash" aria-hidden="true"></div>

<!-- ============ HUD ============ -->
<div id="hud" class="is-hidden" aria-live="off">
  <div class="hud-corner hud-tl">
    <div class="kicker">SCORE</div>
    <div id="score" class="score">0</div>
    <div class="best">BEST <span id="best">0</span></div>
  </div>

  <div class="hud-corner hud-tr">
    <div class="shields" id="shields"><i></i><i></i><i></i></div>
    <div class="mult"><span id="mult">1.0</span><em>×</em></div>
  </div>

  <div class="hud-corner hud-bl">
    <div class="kicker">NITRO</div>
    <div class="nitro"><div id="nitrofill"></div></div>
    <div class="hud-hint" id="hint">← → 转向 · SHIFT 氮气 · SPACE 漂移 · P 暂停</div>
  </div>

  <div class="hud-corner hud-br">
    <div id="speed" class="speed">0</div>
    <div class="unit">KM/H</div>
  </div>

  <div id="toasts"></div>
</div>

<!-- ============ 覆盖层 ============ -->
<div id="overlay">
  <!-- 标题 -->
  <section class="screen" id="screen-title">
    <div class="panel">
      <div class="eyebrow">DEEPSEEK HARNESS · 一局许愿式编程</div>
      <h1 class="logo">NEON<span class="logo-gap"></span>DRIFT</h1>
      <p class="tagline">霓虹夜驰 <b>·</b> 1987 无尽高速</p>

      <div class="keys">
        <div class="key"><kbd>←</kbd><kbd>→</kbd><span>转向</span></div>
        <div class="key"><kbd>SHIFT</kbd><span>氮气加速</span></div>
        <div class="key"><kbd>SPACE</kbd><span>漂移</span></div>
        <div class="key"><kbd>P</kbd><span>暂停</span></div>
      </div>

      <button id="startBtn" class="cta" type="button">开始驾驶<span class="cta-key">ENTER</span></button>
      <p class="fineprint">贴近车流擦身而过可以累积倍率 · 撞车扣一格护盾 · 最高分保存在本机</p>
    </div>
  </section>

  <!-- 暂停 -->
  <section class="screen is-hidden" id="screen-pause">
    <div class="panel compact">
      <h2 class="h2">PAUSED</h2>
      <p class="fineprint">按 <kbd>P</kbd> 继续 · 按 <kbd>ENTER</kbd> 重新开始</p>
      <button id="resumeBtn" class="cta" type="button">继续<span class="cta-key">▶</span></button>
    </div>
  </section>

  <!-- 结束 -->
  <section class="screen is-hidden" id="screen-over">
    <div class="panel">
      <div class="eyebrow">RUN COMPLETE</div>
      <h2 class="h2 big">GAME OVER</h2>
      <div class="stats">
        <div class="stat"><span>SCORE</span><b id="finalScore">0</b></div>
        <div class="stat"><span>DISTANCE</span><b id="finalDist">0<small>km</small></b></div>
        <div class="stat"><span>BEST</span><b id="finalBest">0</b></div>
      </div>
      <p class="rank" id="finalRank">继续加油</p>
      <button id="againBtn" class="cta" type="button">再来一局<span class="cta-key">ENTER</span></button>
    </div>
  </section>
</div>

<script type="module" src="js/neon-drift.js"></script>
</body>
</html>
